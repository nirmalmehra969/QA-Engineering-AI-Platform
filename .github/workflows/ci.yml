name: AI QA Automation & CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python QA Platform & PyTest Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask Server in Background
        run: |
          python app.py &
          sleep 3

      - name: Run Platform Acceptance Tests
        run: |
          python -m pytest tests/test_platform.py -v

  java-selenium-tests:
    name: Java + Selenium + TestNG Automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Python for Target App
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Start Target Store App
        run: |
          pip install -r requirements.txt
          python app.py &
          sleep 4

      - name: Run Maven TestNG Suites
        working-directory: automation
        run: |
          mvn clean test -DbaseUrl=http://127.0.0.1:5000/app/target-store
