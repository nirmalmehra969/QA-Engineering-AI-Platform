services:
  - type: web
    name: qa-testing-assistant
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
